# Cloudflare Worker für exakte DB-Verbindungslinks (vbid).
# Deploy:  cd db-link-worker && npx wrangler login && npx wrangler deploy
# Danach die ausgegebene URL (…workers.dev) in app.js → DB_LINK_PROXY eintragen.

name = "pendelpanda-db-link"
main = "worker.js"
compatibility_date = "2026-08-25"

# Eigene Subdomain <name>.<account>.workers.dev — keine Domain nötig.
workers_dev = true

# Der Worker hält keinen Zustand: keine KV, keine Secrets, keine Bindings.
# Ein Aufruf pro Klick auf „Bei der DB öffnen“, alles andere ist Durchreiche.
